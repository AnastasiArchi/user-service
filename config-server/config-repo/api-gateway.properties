server.port=8080

eureka.client.serviceUrl.defaultZone=http://localhost:8761/eureka/

eureka.client.register-with-eureka=true

eureka.client.fetch-registry=true

spring.cloud.gateway.server.webflux.routes[0].id=user-service

spring.cloud.gateway.server.webflux.routes[0].uri=lb://USER-SERVICE

spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/users/**

spring.cloud.gateway.server.webflux.routes[0].filters[0].name=CircuitBreaker

spring.cloud.gateway.server.webflux.routes[0].filters[0].args.name=userServiceCircuitBreaker

spring.cloud.gateway.server.webflux.routes[0].filters[0].args.fallbackUri=forward:/fallback

resilience4j.circuitbreaker.instances.userServiceCircuitBreaker.slidingWindowType=COUNT_BASED

resilience4j.circuitbreaker.instances.userServiceCircuitBreaker.slidingWindowSize=5

resilience4j.circuitbreaker.instances.userServiceCircuitBreaker.minimumNumberOfCalls=5

resilience4j.circuitbreaker.instances.userServiceCircuitBreaker.failureRateThreshold=50

resilience4j.circuitbreaker.instances.userServiceCircuitBreaker.waitDurationInOpenState=10s

resilience4j.circuitbreaker.instances.userServiceCircuitBreaker.permittedNumberOfCallsInHalfOpenState=2

resilience4j.circuitbreaker.instances.userServiceCircuitBreaker.automaticTransitionFromOpenToHalfOpenEnabled=true

management.endpoints.web.exposure.include=health,info,metrics